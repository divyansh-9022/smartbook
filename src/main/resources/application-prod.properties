# SmartBook Production Configuration

spring.application.name=SmartBook
server.port=${PORT:8080}

# Cloud MySQL Database
spring.datasource.url=${SMARTBOOK_DB_URL}
spring.datasource.username=${SMARTBOOK_DB_USERNAME}
spring.datasource.password=${SMARTBOOK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production Database Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Security
app.jwt.secret=${SMARTBOOK_JWT_SECRET}

# Email Configuration
spring.mail.host=${SMARTBOOK_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SMARTBOOK_MAIL_PORT:587}
spring.mail.username=${SMARTBOOK_MAIL_USERNAME}
spring.mail.password=${SMARTBOOK_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email Sender
app.mail.from=${SMARTBOOK_MAIL_FROM:${SMARTBOOK_MAIL_USERNAME}}

# File Upload Limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Gumroad Licence Configuration
app.gumroad.product-id=${GUMROAD_PRODUCT_ID}
app.license.enforcement-enabled=true

app.frontend.url=${FRONTEND_URL}