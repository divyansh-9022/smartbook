## Email sender
#app.mail.from=${SMARTBOOK_MAIL_FROM:${SMARTBOOK_MAIL_USERNAME}}

# Business logo upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Gumroad software licence configuration
app.gumroad.product-id=4UhwZYx8D_d8C5Qcziev2w==

# Licence enforcement is disabled during local development
app.license.enforcement-enabled=false