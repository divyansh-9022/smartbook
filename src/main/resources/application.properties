spring.application.name=SmartBook
server.port=8080

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/smartbook_db
spring.datasource.username=smartbook_app
spring.datasource.password=${SMARTBOOK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${SMARTBOOK_JWT_SECRET}

# Gmail SMTP Configuration
