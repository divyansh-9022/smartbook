spring.application.name=SmartBook
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://mysql:3306/${SMARTBOOK_DB_NAME:-smartbook_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SMARTBOOK_DB_USERNAME:-smartbook_app}
spring.datasource.password=${SMARTBOOK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${SMARTBOOK_JWT_SECRET}

# Email
spring.mail.host=${SMARTBOOK_MAIL_HOST:-smtp.gmail.com}
spring.mail.port=${SMARTBOOK_MAIL_PORT:-587}
spring.mail.username=${SMARTBOOK_MAIL_USERNAME}
spring.mail.password=${SMARTBOOK_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${SMARTBOOK_MAIL_USERNAME}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Gumroad licence
# Gumroad licence configuration
app.gumroad.product-id=${APP_GUMROAD_PRODUCT_ID:${GUMROAD_PRODUCT_ID:}}
app.license.enforcement-enabled=${APP_LICENSE_ENFORCEMENT_ENABLED:true}

app.frontend.url=${FRONTEND_URL}
