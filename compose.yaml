services:

  mysql:
    image: mysql:8.4
    container_name: smartbook-mysql

    environment:
      MYSQL_DATABASE: smartbook_db
      MYSQL_USER: smartbook_app
      MYSQL_PASSWORD: ${SMARTBOOK_DB_PASSWORD:?Set database password in .env}
      MYSQL_ROOT_PASSWORD: ${SMARTBOOK_DB_ROOT_PASSWORD:?Set root password in .env}

    volumes:
      - smartbook_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    container_name: smartbook-backend

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartbook_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: smartbook_app
      SPRING_DATASOURCE_PASSWORD: ${SMARTBOOK_DB_PASSWORD:?Set database password in .env}
      SMARTBOOK_JWT_SECRET: ${SMARTBOOK_JWT_SECRET:?Set JWT secret in .env}
      SMARTBOOK_MAIL_USERNAME: ${SMARTBOOK_MAIL_USERNAME:?Set mail username in .env}
      SMARTBOOK_MAIL_PASSWORD: ${SMARTBOOK_MAIL_PASSWORD:?Set mail password in .env}

    volumes:
      - ./uploads:/app/uploads
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: smartbook-frontend

    ports:
      - "8081:80"

    depends_on:
      - backend
volumes:
  smartbook_mysql_data: